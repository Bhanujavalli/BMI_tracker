{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="glass-card text-center">
            <i class="fa-solid fa-user-lock fa-3x text-primary mb-3"></i>
            <h3 class="mb-4">Welcome Back</h3>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3 text-start">
                    <label for="username" class="form-label text-muted-custom">Username</label>
                    <input type="text" class="form-control form-control-custom" id="username" name="username" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="password" class="form-label text-muted-custom">Password</label>
                    <input type="password" class="form-control form-control-custom" id="password" name="password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary-custom">Login</button>
                </div>
            </form>
            <p class="mt-4 text-muted-custom small">
                Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
