{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-3x text-primary mb-3"></i>
                <h3>Create an Account</h3>
                <p class="text-muted-custom">Join AIBMI to start tracking your health journey.</p>
            </div>
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label text-muted-custom">Username</label>
                    <input type="text" class="form-control form-control-custom" id="username" name="username" required>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="age" class="form-label text-muted-custom">Age</label>
                        <input type="number" class="form-control form-control-custom" id="age" name="age" min="1" max="120" required>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label for="gender" class="form-label text-muted-custom">Gender</label>
                        <select class="form-select form-control-custom" id="gender" name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="height" class="form-label text-muted-custom">Height (in cm)</label>
                    <input type="number" step="0.1" class="form-control form-control-custom" id="height" name="height" placeholder="e.g., 175" required>
                    <div class="form-text text-muted-custom" style="font-size: 0.8rem;">Note: Height serves as a baseline for future measurements.</div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-muted-custom">Password</label>
                    <input type="password" class="form-control form-control-custom" id="password" name="password" minlength="6" required>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary-custom">Register</button>
                </div>
            </form>
            <div class="text-center mt-4 text-muted-custom small">
                Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none">Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
